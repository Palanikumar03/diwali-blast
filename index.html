
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali Surprise ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #3d206e, transparent 55%),
        linear-gradient(135deg, #100b29, #1b103b, #09071b);
    color: white;
    font-family: 'Nunito', sans-serif;
    overflow-x: hidden;
}

#stars, #fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#stars { z-index: 0; }
#fireworks { z-index: 5; }

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 550px;
    padding: 40px 30px;
    text-align: center;
    border: 1px solid rgba(255, 215, 130, 0.35);
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(18px);
    box-shadow: 0 0 50px rgba(175, 91, 255, 0.18);
}

.diya {
    font-size: 55px;
    margin-bottom: 15px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { filter: drop-shadow(0 0 5px gold); }
    to { filter: drop-shadow(0 0 22px orange); }
}

.main-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(25px, 5vw, 38px);
    line-height: 1.4;
    background: linear-gradient(90deg, #fff0a8, #ffbd42, #fff4c2);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 15px;
}

.description {
    color: #e8dafa;
    font-size: 16px;
    margin-bottom: 25px;
}

.input-label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    color: #ffe6a0;
    font-weight: 800;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    border: 1px solid rgba(255, 220, 150, 0.4);
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 16px;
    outline: none;
    margin-bottom: 20px;
}

input::placeholder {
    color: #c9badc;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #ffbd42, #ffdf8a);
    color: #321747;
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 25px rgba(255, 190, 66, 0.3);
    transition: 0.3s;
}

.primary-btn:hover {
    transform: translateY(-3px);
}

#loading {
    display: none;
}

.spinner {
    width: 65px;
    height: 65px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid #ffcf64;
    border-radius: 50%;
    margin: 25px auto;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-message {
    color: #ffe5a0;
    font-size: 19px;
    font-weight: 800;
    min-height: 55px;
}

#wish {
    display: none;
    width: 100%;
    max-width: 1100px;
    text-align: center;
    margin: auto;
    animation: appear 1.5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.video-container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto 22px;
    padding: 9px;
    border-radius: 22px;
    background: linear-gradient(135deg, #ffdf8a, #a65cff, #ffbd42);
    box-shadow: 0 0 25px rgba(255, 196, 78, 0.3),
                0 0 65px rgba(164, 82, 255, 0.25);
}

video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 78vh;
    min-height: 350px;
    object-fit: contain;
    background: #05030b;
    border-radius: 15px;
}

.final-title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(25px, 4vw, 38px);
    color: #ffdf8a;
    text-shadow: 0 0 15px rgba(255, 194, 75, 0.6);
    margin-top: 5px;
    padding-bottom: 5px;
}

#soundButton {
    display: none;
    margin: 15px auto;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #ffbd42, #ffdf8a);
    color: #321747;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

@media (max-width: 600px) {
    .container { padding: 15px; }
    .card { padding: 30px 20px; }
    #wish { padding: 5px; }

    .video-container {
        padding: 5px;
        border-radius: 14px;
        margin-bottom: 15px;
    }

    video {
        min-height: 250px;
        max-height: 75vh;
        border-radius: 10px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<div class="container">

    <!-- WELCOME SCREEN -->
    <section class="card" id="welcome">

        <div class="diya">🪔</div>

        <h1 class="main-title">A Magical Diwali Surprise</h1>

        <p class="description">
            Something special is waiting for you, nanba! ✨
        </p>

        <label class="input-label" for="friendName">
            Enter your name
        </label>

        <input
            type="text"
            id="friendName"
            placeholder="Your name..."
            autocomplete="off"
        >

        <button class="primary-btn" onclick="startSurprise()">
            Open Your Surprise ✨
        </button>

    </section>

    <!-- LOADING SCREEN -->
    <section class="card" id="loading">

        <div class="diya">🎆</div>

        <h1 class="main-title">Preparing Magic...</h1>

        <div class="spinner"></div>

        <p class="loading-message" id="loadingMessage">
            Lighting up the sky...
        </p>

    </section>

    <!-- FINAL SCREEN -->
    <section id="wish">

        <div class="video-container">

            <video
                id="diwaliVideo"
                playsinline
                controls
                preload="auto"
            >
                <source src="diwali.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>

        </div>

        <button id="soundButton" onclick="playWithSound()">
            🔊 Play Video with Sound ❤️
        </button>

        <h1 class="final-title">
            Happy Diwali Nanba! ❤️
        </h1>

    </section>

</div>

<script>

const welcome = document.getElementById("welcome");
const loading = document.getElementById("loading");
const wish = document.getElementById("wish");
const video = document.getElementById("diwaliVideo");
const soundButton = document.getElementById("soundButton");

const messages = [
    "Lighting up the sky... 🎆",
    "Preparing unlimited sweets... 🍬",
    "Asking the crackers to get ready... 😂",
    "Downloading happiness... ❤️",
    "Almost ready, nanba! ✨"
];

let messageIndex = 0;
let messageTimer;

function startSurprise() {

    const name = document.getElementById("friendName").value.trim();

    if (!name) {
        alert("Nanba, first enter your name! ❤️");
        return;
    }

    welcome.style.display = "none";
    loading.style.display = "block";

    messageIndex = 0;

    document.getElementById("loadingMessage").textContent =
        messages[messageIndex];

    messageTimer = setInterval(() => {

        messageIndex++;

        if (messageIndex < messages.length) {
            document.getElementById("loadingMessage").textContent =
                messages[messageIndex];
        }

    }, 900);

    setTimeout(() => {

        clearInterval(messageTimer);

        loading.style.display = "none";
        wish.style.display = "block";

        launchFireworks();

        // Attempt autoplay WITH SOUND
        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;

        video.play().then(() => {

            // Sound is playing successfully
            soundButton.style.display = "none";

        }).catch((error) => {

            console.log("Browser blocked autoplay with sound:", error);

            // Show manual play option
            soundButton.style.display = "block";

        });

    }, 5000);
}


// Manual sound playback fallback
function playWithSound() {

    video.muted = false;
    video.volume = 1;

    video.play().then(() => {

        soundButton.style.display = "none";

    }).catch(error => {

        console.log("Video playback error:", error);
        alert("Please press the video play button to start.");

    });

}


/* STAR BACKGROUND */

const starCanvas = document.getElementById("stars");
const starCtx = starCanvas.getContext("2d");

let stars = [];

function resizeStars() {

    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;

    stars = [];

    for (let i = 0; i < 110; i++) {

        stars.push({
            x: Math.random() * starCanvas.width,
            y: Math.random() * starCanvas.height,
            radius: Math.random() * 1.8 + 0.3,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.005
        });

    }
}

function drawStars() {

    starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

    stars.forEach(star => {

        star.alpha += star.speed;

        if (star.alpha > 1 || star.alpha < 0.2) {
            star.speed *= -1;
        }

        starCtx.beginPath();
        starCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(255, 225, 160, ${star.alpha})`;
        starCtx.fill();

    });

    requestAnimationFrame(drawStars);
}

resizeStars();
drawStars();

window.addEventListener("resize", resizeStars);


/* FIREWORKS */

const fireCanvas = document.getElementById("fireworks");
const fireCtx = fireCanvas.getContext("2d");

let particles = [];

function resizeFireworks() {

    fireCanvas.width = window.innerWidth;
    fireCanvas.height = window.innerHeight;

}

resizeFireworks();

window.addEventListener("resize", resizeFireworks);

function createFirework(x, y) {

    const colors = [
        "#ffdf8a",
        "#ff5e9c",
        "#a65cff",
        "#ffffff",
        "#5ee7ff"
    ];

    for (let i = 0; i < 65; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1.5;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
        });

    }
}

function animateFireworks() {

    fireCtx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);

    particles.forEach((p, index) => {

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.alpha -= 0.012;

        fireCtx.globalAlpha = Math.max(p.alpha, 0);
        fireCtx.beginPath();
        fireCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        fireCtx.fillStyle = p.color;
        fireCtx.fill();

        if (p.alpha <= 0) {
            particles.splice(index, 1);
        }

    });

    fireCtx.globalAlpha = 1;

    requestAnimationFrame(animateFireworks);
}

animateFireworks();

function launchFireworks() {

    let count = 0;

    const fireworkTimer = setInterval(() => {

        createFirework(
            Math.random() * fireCanvas.width,
            Math.random() * fireCanvas.height * 0.55
        );

        count++;

        if (count >= 18) {
            clearInterval(fireworkTimer);
        }

    }, 400);
}

</script>

</body>
</html>
